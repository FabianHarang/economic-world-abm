schema_version: 0.3.0
scenario_name: milestone_4_browser_100k
description: >
  Milestone 4 browser-scale run: 100,000 households, 1,000 firms, 20 sectors,
  25 private banks, explicit employer-worker links, a directed supplier network,
  household behavior rules, expectation rules, wage offers, matching friction,
  rule switching, intermediate-input inventories, delivery failures, supplier
  rewiring, sector summaries, mortgage pass-through, housing prices,
  construction demand, firm equity values, household portfolio choice, bank
  credit tightness, and a one-time +100 bps policy-rate shock. This is still a
  reduced-scale browser run; the 1,000,000 household target belongs to the
  offline research engine.
economy_context:
  primary: Norway
  secondary: EU_Euro_area
  calibration_status: stylized_norway_first
  notes:
    - Norway is the first empirical calibration target.
    - EU / Euro area comparison follows after Norway-specific assumptions are documented.
    - All current values are stylized placeholders until data-source notes are added.
scale:
  households: 100000
  firms: 1000
  banks: 25
  sectors: 20
  periods: 96
  supplier_edges_target: 5000
  period_unit: month
  reporting_unit: quarter
seed_policy:
  master_seed: 20260618
  paired_counterfactual: true
  rng_algorithm: project_seeded_rng
policy:
  baseline_policy_rate_annual: 0.04
  treatment_shock_bps: 100
  treatment_start_period: 3
  treatment_duration_periods: 12
  loan_rate_pass_through: 0.65
  mortgage_rate_pass_through: 0.75
  deposit_rate_pass_through: 0.45
behavior:
  household_rule_mix:
    hand_to_mouth: 0.35
    liquidity_buffer: 0.30
    habit: 0.20
    debt_stress: 0.15
  expectation_rule_mix:
    adaptive: 0.55
    anchored_target: 0.30
    employer_sector: 0.15
firms:
  cost_channel_strength: 0.35
  average_price_stickiness_months: 4
  inventory_buffer_months: 1.5
  supplier_concentration: medium
production_network:
  input_inventory_target_months: 1.6
  delivery_failure_sensitivity: 0.42
  supplier_rewire_rate: 0.16
  input_substitution_elasticity: 0.22
  input_bottleneck_rule: leontief_with_small_substitution_sensitivity
  calibration_status: stylized_until_norway_io_tables_are_added
labor_market:
  firing_friction: medium
  matching_friction: medium
  wage_indexation: 0.25
households:
  rule_mix:
    hand_to_mouth: 0.35
    liquidity_buffer: 0.30
    habit: 0.20
    debt_stress: 0.15
  expectation_mix:
    adaptive: 0.48
    anchored: 0.32
    extrapolative: 0.10
    employer_sector: 0.10
  rule_switching_intensity: 0.18
  central_bank_credibility: 0.55
  target_inflation_annual: 0.02
  debt_service_sensitivity: 0.42
credit_housing_equity:
  variable_mortgage_share: 0.88
  mortgage_spread_bps: 185
  fixed_mortgage_repricing_speed: 0.08
  housing_supply_elasticity: 0.28
  construction_demand_sensitivity: 0.38
  wealth_effect_strength: 0.16
  collateral_effect_strength: 0.24
  equity_risk_premium: 0.045
  portfolio_rebalance_speed: 0.18
  calibration_status: stylized_norway_first_until_mortgage_housing_portfolio_data_are_added
outputs:
  include_paths:
    - inflation
    - output
    - unemployment
    - vacancies
    - layoffs
    - bankruptcies
    - credit_growth
    - sectoral_prices
    - supply_chain_stress
    - backlog_index
    - delivery_failure_rate
    - supplier_rewire_share
    - input_inventory_index
    - mortgage_rate
    - housing_price_index
    - construction_output_index
    - equity_price_index
    - household_net_worth_index
    - collateral_constraint_index
    - bank_credit_tightness
  monte_carlo_seeds: 20
  store_microstate: false
